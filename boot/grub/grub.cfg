# GRUB leaves its own console on VGA and hands off a linear framebuffer.
set timeout=0
set default='@GRUB_DEFAULT@'

menuentry "Syllaslop Console" --id console {
    multiboot2 /boot/kernel.elf
    set gfxpayload=1024x768x32
    boot
}

menuentry "Syllaslop Console (compact)" --id compact {
    multiboot2 /boot/kernel.elf
    set gfxpayload=800x600x32
    boot
}

menuentry "Syllaslop Console (COM1 recovery)" --id serial {
    multiboot2 /boot/kernel.elf serial
    set gfxpayload=text
    boot
}
